name: Native Builds and DSP Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: biosphere-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dsp-tests:
    name: DSP smoke tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP test without JUCE
        run: c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/DspSmoke.cpp -o biosphere-dsp-tests
      - name: Run DSP test
        run: ./biosphere-dsp-tests
      - name: Stress malformed host buffers, automation and zero allocations
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/PremiumStability.cpp -o biosphere-premium-stress
          ./biosphere-premium-stress
      - name: Build and test Phase 4 DSP routing, macros and master bus
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/DspRouting.cpp -o biosphere-dsp-routing
          ./biosphere-dsp-routing
      - name: Test REACTION modulation and attack-to-memory cascade
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/ReactionRouting.cpp -o biosphere-reaction-tests
          ./biosphere-reaction-tests
      - name: Render all 100 factory patches and test preset history
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/FactoryPresetQuality.cpp -o biosphere-factory-preset-tests
          ./biosphere-factory-preset-tests
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/PresetHistorySmoke.cpp -o biosphere-preset-history-tests
          ./biosphere-preset-history-tests
      - name: Audit 100-patch catalog and A/B/Undo/Redo wiring
        run: python3 Tests/verify_phase10.py
      - name: Stress SOUND ENGINES PRO and parameter-transition continuity
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/SoundEnginesPro.cpp -o biosphere-sound-engines-pro
          ./biosphere-sound-engines-pro
      - name: Verify GUITAR INTELLIGENCE monophonic pitch and harmonic audio
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/GuitarIntelligence.cpp -o biosphere-guitar-intelligence-tests
          ./biosphere-guitar-intelligence-tests
      - name: Validate EVOLUTION living states, crossfades and audio routing
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/EvolutionDynamics.cpp -o biosphere-evolution-tests
          ./biosphere-evolution-tests
      - name: Build and run real-time shared analysis regression
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/AnalysisSmoke.cpp -o biosphere-analysis-tests
          ./biosphere-analysis-tests
      - name: Audit Phase 5 preset browser, analysis and language bindings
        run: python3 Tests/verify_phase5.py
      - name: Audit UI encoding and accented strings
        run: python3 Tests/verify_utf8.py
      - name: Check six ecosystem labels and central state never overlap
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/EcosystemLayoutSmoke.cpp -o biosphere-layout-tests
          ./biosphere-layout-tests
      - name: Build and run navigation routing regression
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -ISource Tests/NavigationSmoke.cpp -o biosphere-navigation-tests
          ./biosphere-navigation-tests
      - name: Verify JUCE node-to-panel wiring
        run: python3 Tests/verify_navigation.py
      - name: Audit all APVTS IDs and UI attachments
        run: python3 Tests/verify_parameter_bindings.py
      - name: Audit processor-to-DSP parameter bridge
        run: python3 Tests/verify_dsp_wiring.py

  macos:
    name: macOS ARM64 (AU + VST3)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: pluginval VST3 + AU compatibility (strictness 5)
        uses: Tracktion/pluginval/validate@286684f72062250fd2494681b7ebdcb721f09e0d
        with:
          pluginval-version: v2.0.0-beta3
          plugins: |
            build/GuitarBiosphere_artefacts/Release/VST3/*.vst3
            build/GuitarBiosphere_artefacts/Release/AU/*.component
          strictness-level: '5'
          args: '--skip-gui-tests --timeout-ms 120000'
          report-dir: ${{ runner.temp }}/guitar-biosphere-pluginval
      - name: Publish macOS pluginval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Biosphere-macOS-pluginval-reports
          path: ${{ runner.temp }}/guitar-biosphere-pluginval/
          if-no-files-found: ignore
      - name: Upload unsigned macOS plugins
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Biosphere-macOS-ARM64-unsigned
          path: |
            build/GuitarBiosphere_artefacts/Release/AU/
            build/GuitarBiosphere_artefacts/Release/VST3/
          if-no-files-found: error

  windows:
    name: Windows x64 (VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: pluginval Windows VST3 compatibility (strictness 5)
        uses: Tracktion/pluginval/validate@286684f72062250fd2494681b7ebdcb721f09e0d
        with:
          pluginval-version: v2.0.0-beta3
          plugins: |
            build/GuitarBiosphere_artefacts/Release/VST3/*.vst3
          strictness-level: '5'
          args: '--skip-gui-tests --timeout-ms 120000'
          report-dir: ${{ runner.temp }}/guitar-biosphere-pluginval
      - name: Publish Windows pluginval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Biosphere-Windows-pluginval-reports
          path: ${{ runner.temp }}/guitar-biosphere-pluginval/
          if-no-files-found: ignore
      - name: Upload unsigned Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Biosphere-Windows-x64-unsigned
          path: build/GuitarBiosphere_artefacts/Release/VST3/
          if-no-files-found: error
